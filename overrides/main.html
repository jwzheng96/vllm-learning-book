{% extends "base.html" %}

{% block content %}
  {{ super() }}
  {% if page.content and "mermaid" in page.content %}
  <script type="module">
    import mermaid from "https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs";

    function renderMermaid() {
      var isDark = document.body.getAttribute("data-md-color-scheme") === "slate";
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? "dark" : "default",
        themeVariables: isDark ? {} : {
          primaryColor: "#3F51B5",
          primaryTextColor: "#ffffff",
          primaryBorderColor: "#303F9F",
          lineColor: "#5C6BC0",
          secondaryColor: "#E8EAF6",
          tertiaryColor: "#C5CAE9",
          fontFamily: "inherit"
        }
      });

      // pymdownx fence_div_format HTML-escapes the source (-> becomes --&gt;).
      // Fix: read textContent (browser decodes entities back to raw text),
      // then replace the div's innerHTML with a fresh unescaped text node
      // so mermaid.run() receives clean source.
      document.querySelectorAll("div.mermaid").forEach(function(el) {
        var raw = el.textContent;
        el.textContent = raw;
      });

      mermaid.run({
        nodes: document.querySelectorAll("div.mermaid")
      });
    }

    renderMermaid();

    // Re-render on theme toggle
    document.addEventListener("click", function(e) {
      var btn = e.target.closest(".md-header__button");
      if (btn && btn.title && btn.title.indexOf("模式") !== -1) {
        setTimeout(function() { location.reload(); }, 200);
      }
    });
  </script>
  {% endif %}
{% endblock %}
