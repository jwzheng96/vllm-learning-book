site_name: vLLM 学习手册
site_description: >-
  一份写给大模型推理工程入门者的源码教程：60 章 · 24K+ 行，
  从 PagedAttention 论文到 K8s 生产部署，每章对照锁定 commit 的 vLLM 源码。
site_url: https://jwzheng96.github.io/vllm-learning-book
repo_url: https://github.com/jwzheng96/vllm-learning-book
repo_name: jwzheng96/vllm-learning-book
edit_uri: edit/main

# docs are assembled into _web/ by scripts/build_site.sh
docs_dir: _web

# Hook: unescape Mermaid source after Markdown→HTML (pymdownx escapes it)
hooks:
  - scripts/mermaid_unescape.py

theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Noto Sans SC, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif
    code: JetBrains Mono, SFMono-Regular, Consolas, monospace
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换日间模式
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang:
        - ja
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

extra_javascript:
  - extras/mathjax-config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - extras/book-theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jwzheng96/vllm-learning-book

