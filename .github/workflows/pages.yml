# GitHub Pages auto-deploy workflow.
#
# Triggers:
#   - push to main (re-builds HTML and publishes)
#   - manual run (workflow_dispatch)
#
# After first push:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. The site will be available at https://<user>.github.io/<repo>/
#
# Notes:
#   - PDF/EPUB are built in CI alongside the HTML site and published to the
#     Pages root (downloadable at /vllm-learning.pdf and /vllm-learning.epub).
#     Mermaid diagrams are pre-rendered to PNG via mermaid-cli.
name: Deploy vLLM learning docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: python -m pip install -r requirements-docs.txt

      - name: Run source-sync unit tests
        run: python3 -m unittest discover -s tests/source_sync -v

      - name: Validate committed source and content review
        run: >-
          python3 -m tools.source_sync validate
          --profile full --require-committed

      - name: Build HTML
        # build_html.py defaults to <repo>/_site/, which is also where
        # actions/upload-pages-artifact expects to find the site. No env
        # override needed.
        run: python3 build_html.py

      - name: Install pandoc + xelatex + mermaid-cli (for PDF/EPUB)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended \
            texlive-latex-extra texlive-fonts-extra \
            fonts-noto-cjk fonts-noto-cjk-extra librsvg2-bin poppler-utils
          # ElegantBook + dependencies (not in Debian's texlive packages)
          sudo tlmgr init-usertree 2>/dev/null || true
          sudo tlmgr update --self
          sudo tlmgr install \
            elegantbook fvextra tcolorbox newunicodechar framed \
            comment csquotes biblatex trimspaces environ mdframed zref needspace \
            tex-gyre newtx tikzfill pdfcol etoc fixtounicode \
            adforn anyfontsize appendix apptools bbding enumitem esint esvect \
            footmisc makecell manfnt multirow titlesec tocloft yhmath \
            mathrsfs rsfs jknapltx
          # mermaid-cli needs node + a headless chromium for diagram rendering.
          sudo npm i -g @mermaid-js/mermaid-cli
          # cairosvg for SVG→PNG cover/favicon (pure python, but needs libcairo).
          python3 -m pip install cairosvg

      - name: Build PDF + EPUB
        # PDF: ElegantBook (green theme) with TikZ vector cover, framed code
        #   blocks, Unicode fallback fonts. Mermaid diagrams pre-rendered to PNG.
        # EPUB: hand-tuned stylesheet (epub.css, wine-red theme), cover JPEG
        #   extracted from the PDF's first page.
        env:
          VLLM_LEARNING_DST: ${{ github.workspace }}/_site
        run: python3 build_pdf_epub.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
